        const keys=new Set();
        state.buttons.forEach(b=>{ if(keyMap[b]) keys.add(keyMap[b]); });
        const addAxis=(v,neg,pos,threshold=.28)=>{ if(v < -threshold) keys.add(neg); if(v > threshold) keys.add(pos); };
        addAxis(state.left.x,'A','D'); addAxis(state.left.y,'S','W');
        addAxis(state.right.x,'LEFT','RIGHT'); addAxis(state.right.y,'DOWN','UP');
        return [...keys];
      };
      function send(){
        const keys=keySet(), sig=keys.slice().sort().join(',');
        if(sig===lastKeys) return; lastKeys=sig;
        if(ws && ws.readyState===WebSocket.OPEN && paired) ws.send(JSON.stringify({type:'keys',keys}));
        status(keys.length ? 'ACTIVE • '+keys.join(' + ') : 'CONNECTED • READY');
      }
      function connect(){
        const scheme=location.protocol==='https:'?'wss:':'ws:';
        ws=new WebSocket(`${scheme}//${location.host}/ws?role=mobile`);
        ws.onopen=()=>{
          fetch('/status').then(r=>r.json()).then(d=>{
            ws.send(JSON.stringify({type:'pair',code:d.code}));
          }).catch(()=>status('PAIRING CODE UNAVAILABLE'));
        };
        ws.onmessage=e=>{ try{const d=JSON.parse(e.data); if(d.type==='paired'){paired=!!d.ok;status(paired?'CONNECTED • READY':'PAIRING FAILED');send();}}catch(_){} };
        ws.onclose=()=>{paired=false;state.buttons.clear();state.left={x:0,y:0};state.right={x:0,y:0};status('DISCONNECTED • RELOAD TO RETRY');};
        ws.onerror=()=>status('CONNECTION ERROR');
      }
      // This receiver page is served by the same laptop process; fetch its one-time code automatically.
      connect();
      function press(name,el){ if(state.buttons.has(name)) return; state.buttons.add(name); el?.classList.add('active'); send(); }
      function release(name,el){ state.buttons.delete(name); el?.classList.remove('active'); send(); }
      document.querySelectorAll('.ctrl-btn').forEach(el=>{
        const name=el.dataset.btn;
        el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);press(name,el);});
        ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();release(name,el);}));
        el.addEventListener('contextmenu',e=>e.preventDefault());
      });
      function setupStick(zoneId,capId,readoutId,which,label){
        const zone=document.getElementById(zoneId), cap=document.getElementById(capId), readout=document.getElementById(readoutId);
        if(!zone||!cap) return;
        let pointer=null;
        const move=e=>{
          const r=zone.getBoundingClientRect(), max=r.width*.34;
          let dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2), dist=Math.hypot(dx,dy);
          if(dist>max){dx=dx/dist*max;dy=dy/dist*max;}
          cap.style.transition='none'; cap.style.transform=`translate3d(${dx}px,${dy}px,0)`;
          state[which].x=+(dx/max).toFixed(2); state[which].y=+(-dy/max).toFixed(2);
          if(readout) readout.textContent=`${label}: ${state[which].x.toFixed(2)}, ${state[which].y.toFixed(2)}`;
          send();
        };
        const reset=()=>{pointer=null;state[which]={x:0,y:0};cap.style.transition='transform .14s ease-out';cap.style.transform='translate3d(0,0,0)';if(readout)readout.textContent=`${label}: 0.00, 0.00`;send();};
        zone.addEventListener('pointerdown',e=>{e.preventDefault();if(pointer!==null)return;pointer=e.pointerId;zone.setPointerCapture(e.pointerId);move(e);});
        zone.addEventListener('pointermove',e=>{if(e.pointerId===pointer)move(e);});
        ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>zone.addEventListener(ev,()=>{if(pointer!==null)reset();}));
      }
      setupStick('left-stick-zone','left-stick-cap','left-stick-readout','left','L3');
      setupStick('right-stick-zone','right-stick-cap','right-stick-readout','right','R3');
      // D-pad and action buttons remain held only while touched. Touchpad tap acts as TAB.
      const canvas=document.getElementById('moving-screen-canvas');
      if(canvas){let down=null;canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});canvas.addEventListener('pointerup',e=>{if(down && Math.hypot(e.clientX-down.x,e.clientY-down.y)<12){press('TOUCHPAD_CLICK');setTimeout(()=>release('TOUCHPAD_CLICK'),100);}down=null;});}
      const recenter=document.getElementById('recenter-screen-btn');
      if(recenter) recenter.addEventListener('click',e=>{e.stopPropagation();status('TOUCHPAD CENTERED');});
      const fs=document.getElementById('fullscreen-btn'), force=document.getElementById('force-landscape-btn');
      async function fullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape').catch(()=>{});}catch(_){}}
      fs?.addEventListener('click',fullscreen); force?.addEventListener('click',fullscreen);
      const sound=document.getElementById('sound-toggle-btn'), on=document.getElementById('sound-icon-on'), off=document.getElementById('sound-icon-off');
      sound?.addEventListener('click',()=>{state.sound=!state.sound;on?.classList.toggle('hidden',!state.sound);off?.classList.toggle('hidden',state.sound);});
      document.addEventListener('visibilitychange',()=>{if(document.hidden){state.buttons.clear();state.left={x:0,y:0};state.right={x:0,y:0};send();}});
      window.addEventListener('blur',()=>{state.buttons.clear();state.left={x:0,y:0};state.right={x:0,y:0};send();});
      window.addEventListener('resize',()=>{if(window.innerHeight>window.innerWidth)status('ROTATE PHONE TO LANDSCAPE');});
    })();
    </script>
</body></html>
