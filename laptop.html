<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTA Controller Receiver</title>
<style>body{font:17px system-ui;background:#10162b;color:white;max-width:650px;margin:50px auto;padding:20px}main{background:#1c2946;padding:28px;border-radius:20px}h1{color:#ff8bc9}.code{font-size:52px;letter-spacing:8px;color:#8fffd0}a{color:#8fffd0}</style></head>
<body><main><h1>🌴 GTA Vice City Controller</h1><p>Open the phone link on the same Wi-Fi network and enter this code:</p><div class="code" id="code">------</div><p>Phone: <a id="url"></a></p><p>Keep this page and the Python server running. Click the GTA game window before using controls.</p></main>
<script>fetch('/status').then(r=>r.json()).then(d=>document.getElementById('code').textContent=d.code);let u='http://'+location.hostname+':8765/mobile';let a=document.getElementById('url');a.href=u;a.textContent=u;new WebSocket('ws://'+location.host+'/ws?role=laptop');</script></body></html>
