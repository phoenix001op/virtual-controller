<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Vice City Gamepad</title>
<style>
*{box-sizing:border-box;touch-action:none;user-select:none}body{margin:0;background:linear-gradient(140deg,#110e2d,#1b3154,#46234d);color:#fff;font:15px system-ui}header{text-align:center;padding:12px}h2{margin:0;color:#ff9bd2}#status{font-size:12px;color:#cbd3ed}#pair,#settings{max-width:440px;margin:18px auto;padding:18px;background:#192541;border-radius:16px}input{width:100%;padding:13px;font-size:22px;text-align:center;letter-spacing:5px;border-radius:9px}button{border:0;color:white;font-weight:bold;background:#334b78;border-radius:12px;padding:11px}#connect{width:100%;background:#c74491;margin-top:10px}#game{display:none}.modes,.extras{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px}.mode.active{background:#ce438e}.layout{display:flex;align-items:center;justify-content:space-around;min-height:57vh;gap:5px}.side{width:48%;display:flex;justify-content:center;align-items:center}#stick{width:min(40vw,220px);height:min(40vw,220px);border-radius:50%;background:#111d3b;border:2px solid #8292c4;position:relative}#knob{position:absolute;left:29%;top:29%;width:42%;height:42%;border-radius:50%;background:linear-gradient(145deg,#eee0ff,#7588c0);border:2px solid white}.actions{display:grid;grid-template-columns:repeat(2,min(17vw,90px));gap:10px}.action{width:min(17vw,90px);height:min(17vw,90px);border-radius:50%;background:linear-gradient(145deg,#75528f,#29426d);border:2px solid #a38ac2}.action span{display:block;font-size:9px;font-weight:normal}.down{background:#c74491!important}#settings{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid label{font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:4px}select{max-width:100px;background:#0c1530;color:white;padding:6px;border-radius:7px}footer{text-align:center;font-size:11px;color:#c0c8e1;padding:10px}</style></head><body>
<header><h2>🌴 GTA VICE CITY GAMEPAD</h2><div id="status">Connect to laptop</div></header>
<section id="pair"><p>Enter laptop pairing code:</p><input id="code" maxlength="6" inputmode="numeric" placeholder="000000"><button id="connect">CONNECT</button><p id="err"></p></section>
<main id="game"><div class="modes"><button class="mode active" id="foot">ON FOOT</button><button class="mode" id="car">IN VEHICLE</button><button id="toggle">⚙ SETTINGS</button></div>
<section id="settings"><b>Change button keys</b><div class="grid" id="grid"></div><div class="extras"><button id="reset">RESET DEFAULTS</button></div></section>
<div class="layout"><div class="side"><div id="stick"><div id="knob"></div></div></div><div class="side"><div class="actions" id="actions"></div></div></div><div class="extras" id="extras"></div><footer>Click the GTA window on your laptop first. Landscape mode recommended.</footer></main>
<script>
let ws,paired=false,mode='foot',held=new Set(),joy=new Set(),pointer=null;
const defaults={foot:{A:'CTRL',B:'SPACE',X:'SHIFT',Y:'F',L:'C',R:'V'},car:{A:'CTRL',B:'SPACE',X:'H',Y:'F',L:'R',R:'SHIFT'}};
let map=JSON.parse(JSON.stringify(defaults));const names={A:'FIRE / DRIVE-BY',B:'JUMP / HANDBRAKE',X:'SPRINT / HORN',Y:'ENTER / EXIT',L:'CROUCH / RADIO',R:'CAMERA / SIREN'};
const keys=['W','A','S','D','SPACE','SHIFT','CTRL','UP','DOWN','LEFT','RIGHT','C','H','V','R','F','E','Q','HOME','INSERT','DELETE','PAGEUP','PAGEDOWN','ENTER','ESC'];
function send(){if(ws&&ws.readyState===1&&paired)ws.send(JSON.stringify({type:'keys',keys:[...held,...joy]}))}
function render(){document.getElementById('foot').classList.toggle('active',mode==='foot');document.getElementById('car').classList.toggle('active',mode==='car');
let defs=mode==='foot'?[['A','FIRE'],['B','JUMP'],['X','SPRINT'],['Y','ENTER / EXIT'],['L','CROUCH'],['R','CAMERA']]:[['A','DRIVE-BY'],['B','HANDBRAKE'],['X','HORN'],['Y','EXIT'],['L','RADIO'],['R','SIREN']];
let area=document.getElementById('actions');area.innerHTML='';defs.forEach(([id,label])=>{let b=document.createElement('button');b.className='action';b.innerHTML=id+'<span>'+label+'</span>';let down=e=>{e.preventDefault();held.add(map[mode][id]);b.classList.add('down');send()},up=e=>{e.preventDefault();held.delete(map[mode][id]);b.classList.remove('down');send()};b.onpointerdown=down;['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up));area.appendChild(b)});
let ex=mode==='foot'?[['CAMERA','V'],['LOOK BACK','HOME'],['PAUSE','ESC']]:[['NEXT RADIO','R'],['CAMERA','V'],['LOOK BACK','HOME']];let x=document.getElementById('extras');x.innerHTML='';ex.forEach(([t,k])=>{let b=document.createElement('button');b.textContent=t;b.onpointerdown=e=>{e.preventDefault();held.add(k);send()};['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();held.delete(k);send()}));x.appendChild(b)});settings()}
function settings(){let g=document.getElementById('grid');g.innerHTML='';Object.keys(names).forEach(id=>{let l=document.createElement('label');l.textContent=id+' '+names[id];let s=document.createElement('select');keys.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o)});s.value=map[mode][id];s.onchange=()=>map[mode][id]=s.value;l.appendChild(s);g.appendChild(l)})}
document.getElementById('foot').onclick=()=>{mode='foot';held.clear();joy.clear();render();send()};document.getElementById('car').onclick=()=>{mode='car';held.clear();joy.clear();render();send()};
document.getElementById('toggle').onclick=()=>{let s=document.getElementById('settings');s.style.display=s.style.display==='block'?'none':'block'};document.getElementById('reset').onclick=()=>{map=JSON.parse(JSON.stringify(defaults));render()};
document.getElementById('connect').onclick=()=>{let c=document.getElementById('code').value.trim();if(c.length!==6){document.getElementById('err').textContent='Enter all six digits';return}ws=new WebSocket(`${location.protocol==='https:'?'wss:':'ws:'}//${location.host}/ws?role=mobile`);ws.onopen=()=>ws.send(JSON.stringify({type:'pair',code:c}));ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.type==='paired'){if(d.ok){paired=true;document.getElementById('pair').style.display='none';document.getElementById('game').style.display='block';document.getElementById('status').textContent='Connected ✓';render()}else{document.getElementById('err').textContent='Wrong code'}}};ws.onclose=()=>{paired=false;held.clear();joy.clear();document.getElementById('status').textContent='Disconnected — refresh and reconnect'}};
let stick=document.getElementById('stick'),knob=document.getElementById('knob');function move(e){let r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,lim=r.width*.29,m=Math.hypot(dx,dy);if(m>lim){dx=dx/m*lim;dy=dy/m*lim}knob.style.transform=`translate(${dx}px,${dy}px)`;let t=r.width*.13,n=new Set();if(Math.abs(dx)>t)n.add(dx<0?'A':'D');if(Math.abs(dy)>t)n.add(dy<0?'W':'S');joy=n;send()}function release(){pointer=null;knob.style.transform='';joy.clear();send()}
stick.onpointerdown=e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);move(e)};stick.onpointermove=e=>{if(e.pointerId===pointer)move(e)};stick.onpointerup=release;stick.onpointercancel=release;
document.addEventListener('visibilitychange',()=>{if(document.hidden){held.clear();joy.clear();send()}});
</script></body></html>
